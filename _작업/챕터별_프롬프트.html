const TABS = CH.map(c=>({id:c.id,label:c.title.split(' · ')[0]+' '+c.title.split(' · ')[1]}))
  .concat([{id:'road',label:'다음 골격'}]);
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.label;b.dataset.id=t.id;
  if(!i)b.className='on';b.onclick=()=>show(t.id);nav.appendChild(b)});

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function show(id){
  [...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(id==='road'){main.innerHTML=ROAD;return}
  const c=CH.find(x=>x.id===id);
  const todo=c.scenes.filter(s=>s.prompt&&s.status==='todo');
  main.innerHTML = `<div class="note">${c.note}</div>`
   + (todo.length?`<button class="act big" onclick="copyAll('${id}')">이 챕터 프롬프트 ${todo.length}개 한 번에 복사</button><div style="height:14px"></div>`:'')
   + c.scenes.map((s,i)=>`
    <div class="scene" id="sc-${id}-${i}">
      <div class="sh" onclick="document.getElementById('sc-${id}-${i}').classList.toggle('open')">
        <span class="num">${s.n}</span>
        <span class="tt">${s.kr}</span>
        <span class="g ${s.grade==='와'?'g-wa':'g-sh'}">${s.grade}</span>
        <span class="st ${s.status==='done'?'st-done':'st-todo'}">${s.status==='done'?'배포됨':'뽑을 것'}</span>
      </div>
      <div class="body">
        <div class="ws">${s.kws.map(k=>`<span class="wd"><b>${k[0]}</b><i>${k[1]}</i></span>`).join('')}</div>
        ${s.prompt
          ? `<pre id="p-${id}-${i}">${esc(s.prompt)}</pre>
             <div class="row"><button class="act" onclick="cp('p-${id}-${i}')">프롬프트 복사</button>
             <span class="c">저장: <b>${s.file}.mp4</b> · 포스터는 로부장이 뽑습니다</span></div>`
          : `<div class="nop">이미 뽑아서 배포된 장면입니다. 프롬프트는 보관하지 않았습니다 - 다시 뽑을 일이 생기면 말씀하십시오.</div>`}
      </div>
    </div>`).join('');
}
function copyAll(id){
  const c=CH.find(x=>x.id===id);
  const t=c.scenes.filter(s=>s.prompt&&s.status==='todo')
    .map(s=>`### ${s.n} ${s.kr}  [${s.grade}]  → ${s.file}.mp4\n단어: ${s.words.join(' ')}\n\n${s.prompt}`).join('\n\n\n');
  navigator.clipboard.writeText(t).then(()=>toast('챕터 전체를 복사했습니다')).catch(()=>toast('복사 실패'));
}
function cp(id){navigator.clipboard.writeText(document.getElementById(id).textContent)
  .then(()=>toast('복사했습니다')).catch(()=>toast('복사 실패 - 직접 선택하십시오'))}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}

const ROAD = `

<tr><td><b>밤 골격</b></td><td>우주와 과학 · 밤과 꿈</td><td>고정부에 <code>clear summer daylight</code>가 박혀 있다</td><td class="c">heaven planet + 별자리·오로라 영상 2편 회수</td></tr>
<tr><td><b>기상 골격</b></td><td>지구와 날씨</td><td><code>fog</code> <code>rainbow</code>가 Never에 있고 <code>storm</code>은 본문 금지어다</td><td class="c">blow flame fog freeze melt smoke steam storm rainbow</td></tr>

<tr><td><b>도해형 골격</b></td><td>자리와 방향(나침반) · 구동사 288편</td><td>요소가 2~3개로 더 적어야 한다. 본상품이 여기 있다</td><td class="c">자리와 방향 25 · 추상어 전량</td></tr>
</tbody></table>
<h2 class="sec">여는 방법 - 골격 하나에 견본 한 장</h2>
<div class="note" style="border-left-color:#8a5a00">
<b>1.</b> 로부장이 골격 초안 + 견본 프롬프트 1개를 낸다<br>
<b>2.</b> 대표님이 그 한 장만 Flow에 넣는다 (Lite 5크레딧)<br>
<b>3.</b> 합격하면 돼지 라이브러리에 봉인 → <b>그 챕터의 프롬프트가 전량 자동 조립된다</b><br>
<b>4.</b> 2회 불합격이면 골격을 다시 짠다. 슬롯을 만지지 않는다
</div>
<h2 class="sec">권장 순서</h2>
<div class="chk"><input type="checkbox"><span><b>① 밤 골격</b> - 이미 뽑아둔 별자리·오로라 영상 2편이 되살아난다. 회수가 가장 크다</span></div>
<div class="chk"><input type="checkbox"><span><b>② 도해형 골격</b> - <b>본상품(구동사 288편)</b>이 여기 걸려 있다. 돈이 나오는 쪽이다</span></div>
<div class="chk"><input type="checkbox"><span><b>③ 기상 골격</b> - 날씨 챕터. 「우울한 엽서」가 나온 그 구간이라 가장 위험하다</span></div>
<div class="chk"><input type="checkbox"><span><b>④ 정물 골격</b> - 음식·살림. 흰 배경 도감과 원래 잘 맞는다</span></div>
<div class="chk"><input type="checkbox"><span><b>⑤ 인물·도시 골격</b> - 얼굴 문제가 있어 마지막</span></div>
<div style="height:20px"></div>`;
show(CH[0].id);
</script></body></html>
