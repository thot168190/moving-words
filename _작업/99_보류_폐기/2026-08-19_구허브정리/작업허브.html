 left and right. The subjects remain centered while both outer edges stay clear. Static locked-off camera, one continuous 8-second take.\n\nThe only visible subjects throughout the sequence are one centered natural-history field study: a forest path crossing the composition, three finely observed sets of tracks pressed into soil, one snapped twig, one tuft of fur caught on bark, and three slender plaster track casts arranged on a narrow field tray. The tracks and casts are rendered only with precise contour and texture lines, using unfilled contour and texture lines.\n\n0-4s: hair-thin pale graphite linework appears progressively from the empty white field. Throughout the whole sequence the frame contains only the flat white surface and the marks already made on it; nothing else is ever present in the frame at any moment. Each line is drawn as a moving point that travels from one end to the other, its advancing tip clearly visible the whole way, one line at a time, so the eye can follow the growing tip of every single stroke. Nothing is revealed by a sweeping wipe and nothing fades into view - every line extends from its own tip. The winding path is drawn first, sweeping gently across the central composition from left to right through many clean short lines. One set of tracks appears step by step, followed by the snapped twig and the tuft of fur. The three plaster casts and their subtle surface textures are drawn last, separately and clearly. Every detail becomes visible sequentially, never all at once.\n\n4-8s: an extremely pale, water-heavy watercolor wash develops gently. All color remains low-saturation and transparent, with white showing through every wash. No area becomes dark, dense or fully filled. The restrained palette is pale leaf green along the path, warm earth brown beneath the tracks, and a restrained russet tint on the fur. The clues remain crisp and stable. One plaster cast slides slowly from the field tray and settles directly over the matching track, registering every pad and claw mark exactly. The other two casts remain on the tray. The finished study stays centered and balanced within the frame. The finished composition contains only the subjects listed above and nothing more, all lines crisp and completely stable, resting inside generous untouched white space.\n\nStyle: master-level fine-line illustration with exceptionally thin, precise pale graphite strokes and sophisticated control, luminous transparent watercolor, restrained tonal contrast, generous white space, sophisticated museum-quality editorial illustration for an adult natural-history atlas, mature and understated, with hairline strokes and no heavy outlines anywhere."}, {"id": "ch4_draft_02_잎의숨은무늬", "name": "잎의숨은무늬", "p": "Cinematic progressive line-reveal animation on a solid pure bright white background (#FFFFFF), edge to edge. The very first frame is an entirely empty pure white field. High-key lighting. The main illustration is centered and occupies the central three-quarters of the frame, with equal narrow breathing margins on the left and right. The subjects remain centered while both outer edges stay clear. Static locked-off camera, one continuous 8-second take.\n\nThe only visible subjects throughout the sequence are five fresh leaves arranged in a loose row, one simple circular magnifying lens on a slim stand, and one tiny cluster of pale insect eggs hidden beneath a leaf.\n\n0-4s: hair-thin pale graphite linework appears progressively from the empty white field. Throughout the whole sequence the frame contains only the flat white surface and the marks already made on it; nothing else is ever present in the frame at any moment. Each line is drawn as a moving point that travels from one end to the other, its advancing tip clearly visible the whole way, one line at a time, so the eye can follow the growing tip of every single stroke. Nothing is revealed by a sweeping wipe and nothing fades into view - every line extends from its own tip const K='inkword_hub_v1';
let S=JSON.parse(localStorage.getItem(K)||'{}');
let cur=0;

function totals(){
  let sc=0,pass=0,ready=0;
  D.chs.forEach(c=>{sc+=c.scenes.length;c.scenes.forEach((s,i)=>{
    if(s.p)ready++; const v=S[c.la+'_'+i]; if(v==='합격')pass++;});});
  return {sc,pass,ready};
}
function renderStat(){
  const t=totals();
  document.getElementById('stat').innerHTML=`
   <div class="st"><b>1200</b>정본 단어</div>
   <div class="st"><b>12</b>챕터</div>
   <div class="st"><b>${t.sc}</b>묶인 장면</div>
   <div class="st ${t.ready?'g':''}"><b>${t.ready}</b>프롬프트 완성</div>
   <div class="st g"><b>${t.pass}</b>합격</div>
   <div class="st r"><b>${t.sc-t.pass}</b>남은 장면</div>`;
  document.getElementById('fill').style.width=(t.sc?100*t.pass/t.sc:0)+'%';
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=D.chs.map((c,i)=>
   `<button class="${i===cur?'on':''}" onclick="go(${i})">${c.no}. ${c.la}<span class="d">${'★'.repeat(c.diff)}</span></button>`
  ).join('')+`<button class="${cur===99?'on':''}" onclick="go(99)">📐 확정 골격</button>`
   +`<button class="${cur===98?'on':''}" onclick="go(98)">🗂 챕터4 완성본 19편</button>`;
}
function go(i){cur=i;renderTabs();renderBody();window.scrollTo(0,0);}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

  if(cur===99){
    b.innerHTML=`<div class="note"><b>확정 골격</b> — 2026-08-10 대표님 확정. 〔 〕 안만 장면별로 채웁니다. <b>나머지는 한 글자도 바꾸지 않습니다.</b><br>
    금지어: <code>hand</code> <code>pen</code> <code>pencil</code> <code>artist</code> <code>tool</code> <code>easel</code> <code>child</code> <code>cartoon</code> <code>charcoal</code> <code>engraving</code> <code>paper</code> <code>draws itself</code></div>
    <div class="card"><h2>8초 영상 확정 골격</h2>
    <textarea readonly id="tk" style="height:300px">${esc(D.skel)}</textarea>
    <div class="btns"><button class="cp" id="bk" onclick="cpEl('tk','bk')">📋 골격 복사</button></div></div>`;
    return;
  }
  if(cur===98){
    b.innerHTML=`<div class="note"><b>챕터4 SCHOLA 완성본 19편</b> — 확정 골격으로 조립 완료. 바로 제작 가능합니다.</div>`+
    D.ch4.map((x,i)=>`<div class="card"><h2>${i+1}. ${x.name}</h2>
      <textarea readonly id="c4${i}">${esc(x.p)}</textarea>
      <div class="btns"><button class="cp" id="b4${i}" onclick="cpEl('c4${i}','b4${i}')">📋 프롬프트 복사</button></div></div>`).join('');
    return;
  }
  const c=D.chs[cur];
  let h=`<div class="card"><h2>${c.no}. ${c.la}<span class="ko">${c.ko} · ${c.nm}</span></h2>
   <div class="meta">난이도 <span style="color:#c9a227">${'★'.repeat(c.diff)}</span> · 단어 <b>${c.n}</b>개 · 예상 장면 <b>${Math.ceil(c.n/6)}</b>편</div>
   <div>${c.cats.map(x=>`<span class="cat">${x[0]} <b>${x[1]}</b></span>`).join('')}</div>
   <details><summary style="cursor:pointer;font-size:13px;color:#5c554a;margin-top:8px">단어 ${c.n}개 전체 보기</summary>
   <div class="wordbox">${c.words.map(w=>`<span class="w">${w}</span>`).join('')}</div></details></div>`;
  if(!c.scenes.length){
    h+=`<div class="empty">아직 장면으로 묶지 않았습니다.<br><b>${c.n}단어 → 약 ${Math.ceil(c.n/6)}장면</b>으로 묶는 작업이 필요합니다.</div>`;
  }else{
    c.scenes.forEach((s,i)=>{
      const v=S[c.la+'_'+i]||'';
      h+=`<div class="sc ${v==='합격'?'pass':v==='불합격'?'fail':''}">
      <div class="hd"><span class="no">${i+1}</span><span class="t">${s.t}</span>
      <span class="tag ${s.p?'rdy':'wait'}">${s.p?'프롬프트 완성':'프롬프트 대기'}</span>
      <span class="st2" style="color:${v==='합격'?'#2f5c3c':'#a8442c'}">${v?(v==='합격'?'✅ 합격':'❌ 불합격'):''}</span></div>
      <div class="d">${s.d}</div>
      <div>${s.w.map(w=>`<span class="w">${w}</span>`).join('')} <span style="color:#8b8272;font-size:12px">${s.w.length}개</span></div>
      ${s.p?`<textarea readonly id="p${cur}_${i}">${esc(s.p)}</textarea>`:''}
      <div class="btns">
        <button class="cp" id="pb${cur}_${i}" ${s.p?`onclick="cpEl('p${cur}_${i}','pb${cur}_${i}')"`:'disabled'}>📋 프롬프트 복사</button>
        <button onclick="mk('${c.la}',${i},'합격')">✅ 합격</button>
        <button onclick="mk('${c.la}',${i},'불합격')">❌ 불합격</button>
        <button onclick="mk('${c.la}',${i},'')">↺</button>
      </div></div>`;
    });
  }
  b.innerHTML=h;
}
function mk(la,i,v){const k=la+'_'+i;if(v)S[k]=v;else delete S[k];
  localStorage.setItem(K,JSON.stringify(S));renderStat();renderBody();}
function cpEl(tid,bid){
  const t=document.getElementById(tid),b=document.getElementById(bid);
  const done=()=>{const o=b.textContent;b.textContent='✓ 복사됨';b.classList.add('done');
    setTimeout(()=>{b.textContent=o;b.classList.remove('done')},1400);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.select();document.execCommand('copy');done()});}
  else{t.removeAttribute('readonly');t.select();t.setSelectionRange(0,999999);document.execCommand('copy');t.setAttribute('readonly','');window.getSelection().removeAllRanges();done();}
}
renderStat();renderTabs();renderBody();
</script></body></html>
