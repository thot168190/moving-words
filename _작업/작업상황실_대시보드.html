    let currentCutId = 'motus-4';

    function renderCutList() {
      const container = document.getElementById('cut-list-container');
      container.innerHTML = '';

      CUTS_DATA.forEach(cut => {
        const card = document.createElement('div');
        card.className = `cut-card ${cut.isOk ? 'is-ok' : ''} ${cut.id === currentCutId ? 'active' : ''}`;
        card.onclick = () => selectCut(cut.id);

        let tagHtml = '';
        if (cut.isOk) {
          tagHtml = '<span class="status-tag ok">✓ 완료 OK</span>';
        } else if (cut.isTarget) {
          tagHtml = '<span class="status-tag target">👉 다음 출격</span>';
        } else {
          tagHtml = '<span class="status-tag wait">대기</span>';
        }

        card.innerHTML = `
          <div>
            <div class="cut-info-title">${cut.ch} · ${cut.title}</div>
            <div class="cut-info-sub">${cut.words}</div>
          </div>
          <div>${tagHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    function selectCut(id) {
      currentCutId = id;
      const cut = CUTS_DATA.find(c => c.id === id);
      if (!cut) return;

      document.getElementById('wb-title').textContent = `${cut.ch} · ${cut.title}`;
      document.getElementById('wb-words').textContent = `배정 단어: ${cut.words}`;
      document.getElementById('wb-prompt').value = cut.prompt;
      document.getElementById('wb-notes').textContent = cut.notes || '안내: 복사 버튼을 눌러 플로우에 넣어주세요!';

      const btnOk = document.getElementById('btn-ok-toggle');
      if (cut.isOk) {
        btnOk.textContent = '✓ 완료됨 (취소하기)';
        btnOk.style.background = '#64748b';
      } else {
        btnOk.textContent = '✓ 생성 OK 완료';
        btnOk.style.background = '#10b981';
      }

      renderCutList();
    }

    function copyCurrentPrompt() {
      const textarea = document.getElementById('wb-prompt');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);

      const btn = document.getElementById('btn-copy');
      const origText = btn.innerHTML;
      btn.innerHTML = '✅ 복사 완료! 플로우에 붙여넣으세요!';
      btn.style.background = '#10b981';
      setTimeout(() => {
        btn.innerHTML = origText;
        btn.style.background = '#3b82f6';
      }, 2000);
    }

    function toggleOkCurrent() {
      const cut = CUTS_DATA.find(c => c.id === currentCutId);
      if (!cut) return;
      cut.isOk = !cut.isOk;
      
      // KPI 업데이트
      const okCount = CUTS_DATA.filter(c => c.isOk).length;
      const percent = Math.round((okCount / CUTS_DATA.length) * 100);
      document.getElementById('kpi-count').textContent = `${okCount} / ${CUTS_DATA.length}`;
      document.getElementById('kpi-percent').textContent = `${percent}%`;
      document.getElementById('main-progress-bar').style.width = `${percent}%`;

      selectCut(currentCutId);
    }
