<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flow Bulk Operator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 10px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    h3 { margin-top: 0; font-size: 16px; color: #333; }
    textarea { flex-shrink: 0; height: 120px; margin-bottom: 10px; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: none; }
    .status-bar { font-size: 13px; font-weight: bold; margin-bottom: 10px; padding: 8px; background: #f0f0f0; border-radius: 4px; display: flex; justify-content: space-between; }
    button { padding: 10px; margin-bottom: 8px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #btn-start { background: #1a73e8; color: white; }
    #btn-stop { background: #d93025; color: white; }
    #log { flex-grow: 1; overflow-y: auto; background: #202124; color: #e8eaed; border-radius: 4px; padding: 10px; font-size: 11px; white-space: pre-wrap; font-family: monospace; line-height: 1.4; }
    .log-time { color: #8ab4f8; margin-right: 5px; }
    .log-err { color: #f28b82; }
    .log-ok { color: #81c995; }
    .log-warn { color: #fde293; }
  </style>
</head>
<body>
  <h3>Flow 벌크 오퍼레이터 v503</h3>
  <textarea id="bulk-input" placeholder="벌크 텍스트를 여기에 붙여넣으세요.&#10;예) 058_강물 측정 실습 | Cinematic..."></textarea>
  
  <div class="status-bar">
    <span>진행: <span id="progress-status" style="color:#1a73e8">0 / 0</span></span>
  </div>
  
  <button id="btn-start">▶ 벌크 작업 시작 (120초 대기)</button>
  <button id="btn-stop">■ 긴급 정지</button>
  
  <div id="log"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
