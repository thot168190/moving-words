<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flow 벌크 오퍼레이터 v5.0.4</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 12px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; background: #f8f9fa; }
    h3 { margin-top: 0; margin-bottom: 8px; font-size: 15px; color: #1e3a8a; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 11px; background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; }
    textarea { flex-shrink: 0; height: 110px; margin-bottom: 8px; font-family: monospace; font-size: 11px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; resize: none; }
    .status-bar { font-size: 12px; font-weight: bold; margin-bottom: 8px; padding: 8px 10px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
    button { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; transition: all 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { background: #cbd5e1 !important; color: #94a3b8 !important; cursor: not-allowed; transform: none; }
    #btn-start { background: #2563eb; color: white; }
    #btn-stop { background: #dc2626; color: white; flex: 0.5; }
    #log { flex-grow: 1; overflow-y: auto; background: #0f172a; color: #f8fafc; border-radius: 6px; padding: 10px; font-size: 11px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; line-height: 1.45; }
    .log-time { color: #60a5fa; margin-right: 5px; }
    .log-err { color: #f87171; font-weight: bold; }
    .log-ok { color: #4ade80; font-weight: bold; }
    .log-warn { color: #fbbf24; }
    .log-info { color: #94a3b8; }
  </style>
</head>
<body>
  <h3>
    <span>Flow 벌크 생성기</span>
    <span class="badge">v5.0.4 코다리</span>
  </h3>
  <textarea id="bulk-input" placeholder="벌크 텍스트를 붙여넣으세요.&#10;예) 058_강물 측정 실습 | Cinematic progressive..."></textarea>
  
  <div class="status-bar">
    <span>진행: <span id="progress-status" style="color:#2563eb">0 / 0</span></span>
    <span id="current-cut" style="color:#64748b; font-weight: normal;">대기 중</span>
  </div>
  
  <div class="btn-group">
    <button id="btn-start">▶ 벌크 자동 생성 시작</button>
    <button id="btn-stop">■ 정지</button>
  </div>
  
  <div id="log"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
